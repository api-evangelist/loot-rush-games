aid: loot-rush-games
name: Loot Rush Games
description: >-
  LootRush (Loot Rush Games) is a San Francisco company, backed by a16z, Paradigm
  and Y Combinator, that operates a crypto-native "global operating account" —
  wallets, cards, cryptocurrency withdrawals and transaction history for gamers
  and marketplaces. It began as a Steam-like platform for blockchain games with
  NFT rentals and has grown into a consumer crypto account and card product. For
  developers, LootRush publishes a Partner API (OpenAPI 3.1) exposing Withdraw,
  History and Connect (OAuth-style, consent-based user data) APIs, plus an
  official hosted, read-only Model Context Protocol (MCP) server that gives AI
  assistants scoped access to a user's own balances, cards, card transactions and
  account history.
